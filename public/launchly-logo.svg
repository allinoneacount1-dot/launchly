<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Round background -->
  <rect x="8" y="8" width="496" height="496" rx="128" fill="url(#bg-grad)" opacity="0.15"/>

  <!-- Outer ring -->
  <rect x="8" y="8" width="496" height="496" rx="128" stroke="url(#bg-grad)" stroke-width="3" fill="none" opacity="0.3"/>

  <!-- Lightning bolt -->
  <path d="M276 132L180 276h76l-28 104 96-144h-76l28-104z" fill="url(#bolt-grad)" filter="url(#glow)"/>

  <!-- Orbit ring 1 -->
  <ellipse cx="256" cy="256" rx="180" ry="60" stroke="url(#bg-grad)" stroke-width="1.5" fill="none" opacity="0.2" transform="rotate(-30 256 256)"/>

  <!-- Orbit ring 2 -->
  <ellipse cx="256" cy="256" rx="180" ry="60" stroke="url(#bg-grad)" stroke-width="1.5" fill="none" opacity="0.15" transform="rotate(30 256 256)"/>

  <!-- Small nodes on orbit -->
  <circle cx="420" cy="196" r="6" fill="#8B5CF6" opacity="0.5"/>
  <circle cx="92" cy="316" r="6" fill="#06B6D4" opacity="0.5"/>
  <circle cx="256" cy="80" r="4" fill="#8B5CF6" opacity="0.4"/>
  <circle cx="256" cy="432" r="4" fill="#06B6D4" opacity="0.4"/>
</svg>
