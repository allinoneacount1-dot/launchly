[package]
name = "launchly-solana"
version = "0.1.0"
description = "Launchly SPL Token Factory — create tokens on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "launchly_solana"

[features]
default = ["cpi"]
cpi = ["no-entrypoint"]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "1.18.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
